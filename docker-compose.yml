services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: hyresbostader-ha
    ports:
      - "8123:8123"
    volumes:
      - ./config:/config
      - ./custom_components/hyresbostader_utility:/config/custom_components/hyresbostader_utility:ro
    environment:
      - TZ=Europe/Stockholm
    restart: unless-stopped
